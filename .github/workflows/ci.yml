name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: savethedate
          POSTGRES_PASSWORD: savethedate
          POSTGRES_DB: savethedate_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U savethedate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://savethedate:savethedate@localhost:5434/savethedate_test
      TEST_DATABASE_URL: postgresql+psycopg://savethedate:savethedate@localhost:5434/savethedate_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # The runner's system Python is externally managed, so install into a venv
      # and put it on PATH for the steps below.
      - name: Install
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app migrations tests

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Test
        run: pytest -q
