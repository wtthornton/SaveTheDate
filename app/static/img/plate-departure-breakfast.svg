<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="An engraved drawing of a coffee pot and two cups in the morning sun">
  <rect width="400" height="300" fill="#EDE2D2"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#A94E2B" stroke-opacity="0.34"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#A94E2B" stroke-opacity="0.14"/>

  <g stroke="#22303A" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Morning sun, low and rising -->
    <circle cx="200" cy="82" r="30" stroke="#A94E2B" stroke-opacity="0.45" stroke-width="1.2"/>
    <g stroke="#A94E2B" stroke-opacity="0.26" stroke-width="1">
      <path d="M200 36v-14M154 82h-16M262 82h-16M167 49l-11-11M233 49l11-11M167 115l-11 11M233 115l11 11"/>
    </g>

    <!-- Steam, the only thing moving this early -->
    <g stroke-opacity="0.45" stroke-width="1.2">
      <path d="M132 150c6-9-6-15 0-24s-5-14 1-21"/>
      <path d="M150 146c5-8-5-13 0-21s-4-12 1-18"/>
      <path d="M272 158c5-8-5-13 0-21s-4-12 1-18"/>
    </g>

    <!-- The pot -->
    <g stroke-width="1.9">
      <path d="M118 166h52v54a14 14 0 0 1-14 14h-24a14 14 0 0 1-14-14z"/>
      <path d="M112 162h64"/>
      <path d="M170 178c16 0 20 8 20 16s-4 16-20 16"/>
      <path d="M118 178l-18-12v-6"/>
    </g>
    <g stroke-width="1.2" stroke-opacity="0.6">
      <path d="M126 192h36M126 204h36"/>
    </g>
    <path d="M136 152h16v10h-16z" stroke-width="1.5"/>

    <!-- Two cups and saucers -->
    <g stroke-width="1.8">
      <path d="M232 186h44v26a12 12 0 0 1-12 12h-20a12 12 0 0 1-12-12z"/>
      <path d="M276 194c11 0 13 6 13 11s-2 11-13 11"/>
      <path d="M220 234h68"/>
      <path d="M306 198h38v22a11 11 0 0 1-11 11h-16a11 11 0 0 1-11-11z"/>
      <path d="M344 205c9 0 11 5 11 9s-2 9-11 9"/>
      <path d="M296 242h58"/>
    </g>

    <!-- Table edge -->
    <path d="M34 256h332" stroke-width="2"/>
    <g stroke-width="1" stroke-opacity="0.35">
      <path d="M52 264h300"/>
    </g>

    <path d="M200 276l6 6-6 6-6-6z" fill="#E3B9A4" stroke="none"/>
  </g>
</svg>
