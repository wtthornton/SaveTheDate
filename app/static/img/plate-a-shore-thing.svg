<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="An engraved drawing of a beach house raised on pilings above the dunes">
  <rect width="400" height="300" fill="#EDE2D2"/>

  <!-- The same double engraved rule as the hero frame, so these plates read as part
       of the stationery rather than as a missing photograph. -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#A94E2B" stroke-opacity="0.34"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#A94E2B" stroke-opacity="0.14"/>

  <g stroke="#22303A" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Low sun behind the house -->
    <circle cx="308" cy="96" r="25" stroke="#A94E2B" stroke-opacity="0.5" stroke-width="1.2"/>
    <g stroke="#A94E2B" stroke-opacity="0.3" stroke-width="1">
      <path d="M308 57v-13M308 148v13M347 96h13M256 96h13M336 68l9-9M271 124l-9 9M336 124l9 9M271 68l-9-9"/>
    </g>

    <!-- Gulf horizon -->
    <g stroke-opacity="0.35" stroke-width="1">
      <path d="M28 176h344"/>
      <path d="M44 186h60M124 186h44M196 186h58M270 186h84"/>
      <path d="M60 195h38M140 195h52M232 195h40M296 195h46"/>
    </g>

    <!-- The house: pitched roof, deck, and the pilings every house here stands on -->
    <path d="M104 132 196 88l92 44" stroke-width="2"/>
    <path d="M118 132v58h156v-58" stroke-width="2"/>
    <path d="M100 132h192" stroke-width="1.6"/>

    <!-- Windows and a door onto the deck -->
    <g stroke-width="1.3" stroke-opacity="0.75">
      <rect x="134" y="146" width="28" height="26"/>
      <rect x="230" y="146" width="28" height="26"/>
      <path d="M182 190v-38h28v38"/>
      <path d="M148 146v26M244 146v26M134 159h28M230 159h28"/>
    </g>

    <!-- Deck and rail -->
    <path d="M96 190h200" stroke-width="2"/>
    <path d="M96 204h200M96 190v14M296 190v14" stroke-width="1.4"/>
    <g stroke-width="1" stroke-opacity="0.6">
      <path d="M116 190v14M136 190v14M156 190v14M176 190v14M196 190v14M216 190v14M236 190v14M256 190v14M276 190v14"/>
    </g>

    <!-- Pilings -->
    <g stroke-width="1.8">
      <path d="M112 204v44M150 204v44M242 204v44M280 204v44"/>
    </g>

    <!-- Steps down to the sand -->
    <g stroke-width="1.3">
      <path d="M296 204l30 44"/>
      <path d="M302 212h12M308 221h12M314 230h12M320 239h12"/>
    </g>

    <!-- Dune line and sea oats -->
    <path d="M22 250c40-8 78 2 118-2s76-10 118-4 82 10 120 2" stroke-width="1.6"/>
    <g stroke-width="1.1" stroke-opacity="0.65">
      <path d="M52 250c2-16 6-24 12-30M60 250c-2-14-1-22 4-28M74 250c3-13 9-19 16-23"/>
      <path d="M330 250c2-15 7-22 13-27M340 250c-2-12 0-19 5-25"/>
      <path d="M196 250c2-11 6-16 11-19M206 250c-2-10 0-15 4-19"/>
    </g>

    <!-- The diamond that marks every divider on the site -->
    <path d="M200 272l6 6-6 6-6-6z" fill="#E3B9A4" stroke="none"/>
  </g>
</svg>
