<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="An engraved drawing of a small fishing skiff on the bay at first light">
  <rect width="400" height="300" fill="#EDE2D2"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#A94E2B" stroke-opacity="0.34"/>
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#A94E2B" stroke-opacity="0.14"/>

  <g stroke="#22303A" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- First light over the bay -->
    <circle cx="300" cy="84" r="22" stroke="#A94E2B" stroke-opacity="0.45" stroke-width="1.2"/>
    <g stroke="#A94E2B" stroke-opacity="0.26" stroke-width="1">
      <path d="M300 48v-11M300 131v11M336 84h11M253 84h11M326 58l8-8M274 110l-8 8"/>
    </g>

    <!-- Birds, because there always are -->
    <g stroke-width="1.2" stroke-opacity="0.55">
      <path d="M76 68q8-7 16 0q8-7 16 0"/>
      <path d="M120 52q6-5 12 0q6-5 12 0"/>
      <path d="M150 78q5-4 10 0q5-4 10 0"/>
    </g>

    <!-- Far shoreline -->
    <path d="M24 150h352" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M24 146q30-6 56-1t54-2 52 3 58-4 52 3 60-2" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- The skiff -->
    <g stroke-width="2">
      <path d="M118 196h150l-18 30a12 12 0 0 1-10 6h-96a12 12 0 0 1-10-6z"/>
      <path d="M112 196h162"/>
    </g>
    <g stroke-width="1.3" stroke-opacity="0.7">
      <path d="M140 206h106M150 216h86"/>
      <!-- Bench seats -->
      <path d="M156 196v-12h26v12M204 196v-12h26v12"/>
    </g>

    <!-- Rod, arced, with a line into the water -->
    <g stroke-width="1.6">
      <path d="M248 188c18-22 40-40 66-52" stroke-opacity="0.85"/>
      <path d="M256 180l-6-8"/>
      <path d="M314 136q14 30 18 66" stroke-width="1" stroke-opacity="0.55"/>
      <circle cx="332" cy="204" r="3" fill="#A94E2B" stroke="none"/>
    </g>

    <!-- The bay -->
    <g stroke-opacity="0.4" stroke-width="1.1">
      <path d="M34 246h58M110 246h52M186 246h60M268 246h44M326 246h42"/>
      <path d="M52 258h44M120 258h66M206 258h50M276 258h62"/>
      <path d="M40 270h50M112 270h58M198 270h44M266 270h56"/>
    </g>
    <!-- The skiff's own wake -->
    <path d="M104 238q16 6 32 0" stroke-width="1.1" stroke-opacity="0.5"/>
    <path d="M258 238q16 6 32 0" stroke-width="1.1" stroke-opacity="0.5"/>

    <path d="M200 282l5 5-5 5-5-5z" fill="#E3B9A4" stroke="none"/>
  </g>
</svg>
