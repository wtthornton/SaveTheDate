[project]
name = "savethedate"
version = "0.1.0"
description = "Save-the-date and RSVP service for weddings and events"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    # Starlette requires it before `request.form()` will parse anything at all,
    # urlencoded included — the RSVP form posts as a plain HTML form.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "httpx2>=2.13",
    "ruff>=0.14",
    "mypy>=1.18",
    # Layout and visual tests drive a real browser: a stylesheet scan cannot see
    # cascade, and no non-visual test caught the hero rendering as an empty box.
    "playwright>=1.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
